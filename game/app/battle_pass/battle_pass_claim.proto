syntax = "proto3";
package game.app;
option java_package = "com.game.server.proto";
option java_outer_classname = "BattlePassClaimContract";
import "game/model/battle_pass.proto";
import "game/model/resource.proto";
message BattlePassClaimRequestProto { string battle_pass_id = 1; string node_id = 2; }
message BattlePassClaimResponseProto {
  string node_id = 1;
  game.model.BattlePassRewardProto reward = 2;
  game.model.BattlePassProgressProto progress = 3;
  repeated game.model.Resource resources = 4;
  repeated game.model.HeroProto owned_heroes = 5;
}
